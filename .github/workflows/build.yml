name: Test and Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - v*

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout repo
      uses: actions/checkout@v7
    - name: Run tests and lint
      uses: ./.github/actions/test
  build:
    runs-on: ubuntu-26.04
    needs: test
    steps:
    - name: Checkout repo
      uses: actions/checkout@v7
    # The Dockerfiles cross-compile on the build platform, so no QEMU.
    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v4
    - name: Login to the registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Collect image metadata
      id: meta
      uses: docker/metadata-action@v6
    # The layer cache doesn't keep RUN --mount=type=cache, so the Go module
    # and build caches are saved separately and loaded into the builder.
    - name: Cache Go modules and builds
      id: cache
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/go-cache
        key: go-docker-${{ hashFiles('go.sum') }}-${{ github.sha }}
        restore-keys: |
          go-docker-${{ hashFiles('go.sum') }}-
          go-docker-
    - name: Load Go caches into the builder
      uses: reproducible-containers/buildkit-cache-dance@v3
      with:
        builder: ${{ steps.buildx.outputs.name }}
        cache-map: |
          {
            "${{ runner.temp }}/go-cache/pkg": "/go/pkg/",
            "${{ runner.temp }}/go-cache/build": "/root/.cache/"
          }
        scratch-dir: ${{ runner.temp }}/cache-dance
        skip-extraction: ${{ steps.cache.outputs.cache-hit }}
    - name: Build and push
      uses: docker/bake-action@v7
      env:
        REGISTRY: ${{ env.REGISTRY }}
        TAGS: ${{ steps.meta.outputs.tag-names }}
        GHA_CACHE: "true"
      with:
        source: .
        files: |
          ./docker-bake.hcl
          cwd://${{ steps.meta.outputs.bake-file-labels }}
        push: true
